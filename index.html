xt-align:left;font-size:13px}th{background:#fafcfb;color:#687970}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.ok{background:#e5f7ed;color:var(--g)}.warn{background:#fff3d4;color:#9a7210}.bad{background:#fde8e8;color:#b72d2d}.info{background:#e9f1ff;color:#2e68b1}.graybadge{background:#eef2f0;color:#607168}.progress{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e8efeb;min-width:120px}.seg{flex:1;border-right:2px solid #fff}.done{background:#1aa263}.yellow{background:#e6ad27}.red{background:#d94b4b}.empty{background:#e8efeb}.pwrap{display:flex;align-items:center;gap:7px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#53685f;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d6e3dc;border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:85px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modalbg{position:fixed;inset:0;background:#0b261a88;z-index:50;display:flex;justify-content:center;align-items:center;padding:15px}.modal{background:#fff;border-radius:20px;padding:20px;width:min(900px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.loginbox{width:min(440px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 20px 55px #0b5b3020;text-align:center}.loginbox img{width:145px}.hint{background:#f6faf8;border:1px dashed #cbded3;padding:10px;border-radius:10px;text-align:left;font-size:12px;margin-top:12px}.toast{position:fixed;right:16px;bottom:16px;background:#173b2c;color:#fff;padding:12px 15px;border-radius:11px;z-index:100}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{padding:12px;background:#fff7df;border:1px solid #efdd9a;border-radius:12px}.success{padding:12px;background:#e8f8ef;border:1px solid #c5e9d3;border-radius:12px;color:#17663f}@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.side{width:210px}}@media(max-width:700px){.layout{display:block}.side{position:fixed;left:-250px;top:76px;z-index:30;width:235px;transition:.2s}.side.open{left:0}.main{padding:14px}.g4,.g3,.g2,.form{grid-template-columns:1fr}.head{flex-direction:column}.brand b{font-size:14px}.brand small{font-size:11px}}

let db=load();function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...DEF,...x,settings:{...DEF.settings,...x.settings}}:structuredClone(DEF)}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}function d(s){return s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—'}function toast(x){let e=document.getElementById('toast');e.innerHTML='<div class="toast">'+esc(x)+'</div>';setTimeout(()=>e.innerHTML='',2500)}function openM(t,b){document.getElementById('modal').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal"><div class="modalhead"><h2>'+t+'</h2><button class="btn gray" onclick="closeM()">✕</button></div>'+b+'</div></div>'}function closeM(){document.getElementById('modal').innerHTML=''}function st(x){let c=['Aktif Belajar','Resmi Terdaftar','Sudah Bayar','Hadir','Aktif'].includes(x)?'ok':['Menunggu Pembayaran Pendaftaran','Menunggu Konfirmasi','Menunggu Kunjungan','Menunggu Persetujuan Admin'].includes(x)?'warn':['Tidak Aktif','Tidak hadir','Belum Bayar'].includes(x)?'bad':'info';return '<span class="badge '+c+'">'+esc(x)+'</span>'}
function S(id){return db.students.find(x=>x.id===id)}function T(id){return db.tutors.find(x=>x.id===id)}function prog(s){let target=s.target||8,done=db.meetings.filter(m=>m.studentId===s.id&&m.reported&&m.att==='Hadir').length;return{target,done}}function bar(s){let p=prog(s),g=p.target===8?db.settings.green2:db.settings.green3,r=p.target===8?db.settings.red2:db.settings.red3,h='<div class="progress">';for(let i=1;i<=p.target;i++)h+='<div class="seg '+(i<=p.done?(i>=r?'red':i>=g?'yellow':'done'):'empty')+'"></div>';return h+'</div>'}function pkg(s){let p=prog(s),r=p.target===8?db.settings.red2:db.settings.red3;return p.done>=p.target?['SAATNYA TAGIHAN','bad']:p.done>=r?['Mendekati akhir','warn']:['Aman','ok']}
function render(){if(location.hash.startsWith('#evaluasi=')){parentPage(decodeURIComponent(location.hash.slice(10)));return}if(!db.session){loginPage();return}shell()}function loginPage(){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><img src="'+LOGO+'"><h1>MPC Management System</h1><p class="muted">Muslim Privat Cendekia Gorontalo</p><form onsubmit="login(event)"><label style="text-align:left">Username / Tutor ID</label><input id="lu" required><label style="text-align:left;margin-top:10px">Password</label><input id="lp" type="password" required><button class="btn primary" style="width:100%;margin-top:14px">Masuk</button></form><div class="hint"><b>Mode uji:</b> Admin = <b>admin</b> / <b>123456</b>. Tutor dibuat dari menu Data Tutor.</div></div></div>'}function login(e){e.preventDefault();let u=lu.value.trim(),p=lp.value;if(u==='admin'&&p==='123456'){db.session={role:'admin',id:'admin'};save();render();return}let t=db.tutors.find(x=>x.tutorId===u&&x.password===p&&x.status==='Aktif');if(t){db.session={role:'tutor',id:t.id};save();render()}else toast('Login gagal atau tutor tidak aktif.')}

function evaluate(){let a=db.session.role==='admin'?db.students:db.students.filter(s=>(T(db.session.id)?.students||[]).includes(s.id));document.getElementById('main').innerHTML='<div class="head"><div><h1>📈 Evaluasi Siswa</h1><span class="muted">Terbitkan evaluasi dan bagikan link ke orang tua.</span></div></div><div class="card"><div class="table"><table><tr><th>Siswa</th><th>Progress</th><th>Evaluasi</th><th>Feedback</th><th></th></tr>'+a.map(s=>'<tr><td><b>'+esc(s.name)+'</b></td><td>'+prog(s).done+'/'+prog(s).target+'</td><td>'+db.evaluations.filter(x=>x.studentId===s.id).length+'</td><td>'+db.feedbacks.filter(x=>x.studentId===s.id).length+'</td><td><button class="btn primary" onclick="evalForm(\''+s.id+'\')">＋ Evaluasi</button> <button class="btn" onclick="copyLink(\''+s.id+'\')">🔗 Link</button></td></tr>').join('')+'</table></div></div>'}function evalForm(id){let s=S(id);openM('📈 Evaluasi — '+esc(s.name),'<form onsubmit="saveEval(event,\''+id+'\')"><div class="form"><div><label>Periode</label><input id="eper" value="Oktober 2026" required></div>'+['Pemahaman','Kemandirian','Ketelitian','Keaktifan','Konsistensi'].map((x,i)=>'<div><label>'+x+'</label><select id="er'+i+'"><option value="5">5 / 5</option><option value="4">4 / 5</option><option value="3">3 / 5</option><option value="2">2 / 5</option><option value="1">1 / 5</option></select></div>').join('')+'<div class="full"><label>Materi yang sudah dikuasai *</label><textarea id="emaster" required></textarea></div><div class="full"><label>Yang perlu ditingkatkan</label><textarea id="eimp"></textarea></div><div class="full"><label>Rekomendasi tutor</label><textarea id="erec"></textarea></div></div><div class="actions"><button class="btn primary">Terbitkan Evaluasi</button></div></form>')}function saveEval(e,id){e.preventDefault();db.evaluations.push({id:uid('ev'),studentId:id,tutorId:db.session.role==='tutor'?db.session.id:S(id).tutorId,period:eper.value,ratings:[+er0.value,+er1.value,+er2.value,+er3.value,+er4.va function feedback(){let ids=db.session.role==='admin'?db.students.map(s=>s.id):(T(db.session.id)?.students||[]),a=db.feedbacks.filter(f=>ids.includes(f.studentId));document.getElementById('main').innerHTML='<div class="head"><div><h1>💬 Feedback Orang Tua</h1><span class="muted">Rating wajib diisi oleh orang tua.</span></div></div><div class="card">'+(a.length?a.map(f=>'<p><b>'+esc(S(f.studentId)?.name||'—')+'</b> · '+('⭐'.repeat(f.rating))+'<br>'+esc(f.text||'Tanpa komentar')+'<br><span class="muted">'+d(f.date)+'</span></p>').join(''):'<div class="empty">Belum ada feedback.</div>')+'</div>'}
function finance(){let active=db.students.filter(s=>s.status==='Aktif Belajar'),paid=db.payments.reduce((n,p)=>n+p.amount,0),hon=db.meetings.filter(m=>m.reported&&m.att==='Hadir').length*db.settings.tutorFee;document.getElementById('main').innerHTML='<div class="head"><div><h1>💰 Infaq & Honor</h1><span class="muted">Khusus Admin.</span></div><button class="btn primary" onclick="payForm()">＋ Catat Infaq</button></div><div class="grid g3"><div class="card stat"><div class="num" style="color:var(--g)">'+money(paid)+'</div>Infaq tercatat</div><div class="card stat"><div class="num" style="color:var(--o)">'+money(hon)+'</div>Estimasi honor tutor</div><div class="card stat"><div class="num" style="color:var(--red)">'+active.filter(s=>pkg(s)[0]==='SAATNYA TAGIHAN').length+'</div>Perlu ditagih</div></div><div style="height:14px"></div><div class="card"><h2>🔴 Perlu Ditagih</h2>'+studentTable(active.filter(s=>pkg(s)[0]==='SAATNYA TAGIHAN'))+'</div>'}function payForm(){openM('💰 Catat Infaq','<form onsubmit="savePay(event)"><div class="form"><div><label>Siswa</label><select id="ps">'+db.students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div><label>Jumlah</label><input id="pamt" type="number" required></div><div><label>Tanggal</label><input id="pdate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Metode</label><select id="pm"><option>Transfer</option><option>QRIS</option><option>Tunai</option><option>Lainnya</option></select></div></div><div class="actions"><button class="btn primary">Simpan</button></div></form>')}function savePay(e){e.preventDefault();db.payments.push({id:uid('pay'),studentId:ps.value,amount:+pamt.value,date:pdate.value,method:pm.value,type:'infaq'});save();closeM();toast('Pembayaran tercatat');finance()}
function reports(){let m=db.meetings.filter(x=>x.reported),rev=db.payments.reduce((n,p)=>n+p.amount,0),hon=m.filter(x=>x.att==='Hadir').length*db.settings.tutorFee;document.getElementById('main').innerHTML='<div class="head"><div><h1>📊 Laporan</h1><span class="muted">Ringkasan operasional MPC.</span></div><button class="btn primary" onclick="exportCSV()">📥 Export CSV</button></div><div class="grid g4"><div class="card stat"><div class="num">'+db.students.length+'</div>Total Siswa</div><div class="card stat"><div class="num" style="color:var(--blue)">'+m.length+'</div>Pertemuan</div><div class="card stat"><div class="num" style="color:var(--g)">'+money(rev)+'</div>Infaq</div><div class="card stat"><div class="num" style="color:var(--o)">'+money(hon)+'</div>Honor Tutor</div></div><div style="height:14px"></div><div class="card">'+studentTable(db.students)+'</div>'}function settings(){let s=db.settings;document.getElementById('main').innerHTML='<div class="head"><div><h1>⚙️ Pengaturan</h1><span class="muted">Harga, progress, identitas dan mapel.</span></div></div><div class="card"><form onsubmit="saveSet(event)"><div class="form"><div><label>Biaya pendaftaran</label><input id="regfee" type="number" value="'+s.regFee+'"></div><div><label>Honor tutor / pertemuan</label><input id="tfee" type="number" value="'+s.tutorFee+'"></div><div><label>Normal 2×/pekan — 8x</label><input id="p2" type="number" value="'+s.price2+'"></div><div><label>Normal 3×/pekan — 12x</label><input id="p3" type="number" value="'+s.price3+'"></div><div><label>Promo 2×/pekan</label><input id="pr2" type="number" value="'+s.promo2+'"></div><div><label>Promo 3×/pekan — 12x</label><input id="pr3" type="number" value="'+s.promo3+'"></div><div><label>Hijau berakhir — 8</label><input id="g2" type="number" min="1" max="8" value="'+s.green2+'"></div><div><label>Merah mulai — 8</label><input id="r2" type="number" min="1" max="8" value="'+s.red2+'"></div><div><label>Hijau berakhir — 12</label><input id="g3" type="number" min="1" max="12" value="'+s.green3+'"></div><div><label>Merah mulai — 12</label><input id="r3" type="number" min="1" max="12" value="'+s.red3+'"></div></div><div class="actions"><button class="btn primary">Simpan Pengaturan</button></div></form></div><div style="height:14px"></div><div class="card"><h2>📚 Daftar Mapel</h2><div>'+db.subjects.map((x,i)=>'<span class="badge ok" style="margin:3px">'+esc(x)+' <button onclick="rmSub('+i+')" style="background:none">×</button></span>').join('')+'</div><div class="actions"><input id="newsub" placeholder="Tambah mapel" style="max-width:350px"><button class="btn" onclick="addSub()">＋ Tambah</button></div></div>'}function saveSet(e){e.preventDefault();Object.assign(db.settings,{regFee:+regfee.value,tutorFee:+tfee.value,price2:+p2.value,price3:+p3.value,promo2:+pr2.value,promo3:+pr3.value,green2:+g2.value,red2:+r2.value,green3:+g3.value,red3:+r3.value});save();toast('Pengaturan disimpan');settings()}function addSub(){let x=newsub.value.trim();if(x&&!db.subjects.includes(x))db.subjects.push(x);save();settings()}function rmSub(i){db.subjects.splice(i,1);save();settings()}
function backup(){document.getElementById('main').innerHTML='<div class="head"><div><h1>💾 Backup & Restore</h1><span class="muted">Data versi awal tersimpan di browser.</span></div></div><div class="grid g2"><div class="card"><h2>📥 Backup</h2><p>Download seluruh data sebagai JSON.</p><button class="btn primary" onclick="downloadBackup()">Download Backup</button></div><div class="card"><h2>📤 Restore</h2><input type="file" accept="application/json" onchange="restore(event)"></div></div><div style="height:14px"></div><div class="notice">Backup rutin sangat disarankan karena versi awal menggunakan localStorage browser.</div>'}function downloadBackup(){let x={...db,session:null},b=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MPC_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.settings)throw 0;x.session=db.session;db=x;save();toast('Restore berhasil');render()}catch{toast('File backup tidak valid')}};r.readAsText(e.target.files[0])}
function profile(){let t=T(db.session.id);document.getElementById('main').innerHTML='<div class="head"><div><h1>👤 Profil Saya</h1></div></div><div class="card"><h2>'+esc(t.name)+'</h2><p>ID: '+esc(t.tutorId)+'<br>WhatsApp: '+esc(t.whatsapp||'—')+'<br>Pendidikan: '+esc(t.education||'—')+'<br>Mapel: '+esc(t.subjects||'—')+'</p>'+st(t.status)+'</div>'}

function parentPage(id){let s=S(id);if(!s){document.body.innerHTML='<div class="empty" style="padding:60px">Link evaluasi tidak ditemukan.</div>';return}let ev=[...db.evaluations].filter(x=>x.studentId===id&&x.published).sort((a,b)=>b.date.localeCompare(a.date))[0],p=prog(s);document.body.innerHTML='<div class="login" style="align-items:flex-start"><div style="width:min(850px,100%)"><div class="card" style="text-align:center"><img src="'+LOGO+'" style="width:120px"><h1>Muslim Privat Cendekia</h1><div class="muted">Laporan Perkembangan Siswa · Gorontalo</div></div><div class="card" style="margin-top:14px"><h2>👨‍🎓 '+esc(s.name)+'</h2><p>'+esc(s.program||'—')+' · '+esc(s.subject||'—')+'<br>'+esc(s.frequency||'—')+' · Tutor: '+esc(T(s.tutorId)?.name||'—')+'</p><div class="pwrap"><b>'+p.done+'/'+p.target+'</b>'+bar(s)+'</div></div>'+(ev?'<div class="card" style="margin-top:14px"><h2>📈 Evaluasi · '+esc(ev.period)+'</h2><div class="grid g2">'+['Pemahaman','Kemandirian','Ketelitian','Keaktifan','Konsistensi'].map((x,i)=>'<div><b>'+x+'</b><div>'+('⭐'.repeat(ev.ratings[i]))+'</div></div>').join('')+'</div><hr><h3>Materi yang sudah dikuasai</h3><p>'+esc(ev.mastered)+'</p><h3>Yang perlu ditingkatkan</h3><p>'+esc(ev.improve||'—')+'</p><h3>Rekomendasi Tutor</h3><p>'+esc(ev.recommendation||'—')+'</p></div>':'<div class="card" style="margin-top:14px"><div class="empty">Evaluasi belum diterbitkan.</div></div>')+'<div class="card" style="margin-top:14px"><h2>💬 Feedback Orang Tua</h2><p class="muted">Rating bintang wajib diisi.</p><form onsubmit="sendFeedback(event,\''+id+'\',\''+(ev?.id||'')+'\')"><label>⭐ Kepuasan *</label><div id="stars" class="actions">'+[1,2,3,4,5].map(i=>'<button type="button" class="btn" data-s="'+i+'" onclick="star('+i+')">☆</button>').join('')+'</div><input id="fr" type="hidden"><label style="margin-top:12px">📝 Feedback / Saran</label><textarea id="ft"></textarea><button class="btn primary" style="margin-top:12px">📤 Kirim Feedback</button></form></div></div>'}function star(n){fr.value=n;document.querySelectorAll('#stars button').forEach(b=>b.innerText=+b.dataset.s<=n?'★':'☆')}function sendFeedback(e,sid,eid){e.preventDefault();if(!+fr.value){alert('Rating bintang wajib diisi.');return}db.feedbacks.push({id:uid('fb'),studentId:sid,evaluationId:eid,date:new Date().toISOString().slice(0,10),rating:+fr.value,text:ft.value});save();e.target.innerHTML='<div class="success">✅ Terima kasih atas feedback Ayah/Bunda.</div>'}
